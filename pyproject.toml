[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orange3-paralelo"
version = "0.1.0"
description = "Orange widgets that spread model evaluation across CPU cores, and a fast linear SVM for text"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Carlos Ponce Schaller", email = "schaller.ponce@gmail.com" }]
requires-python = ">=3.11"  # la de Orange 3.40
# Probado con Orange 3.40; con otra versión, los widgets paralelos corren el original en serie y avisan
# (evaluacion.VERSIONES_PROBADAS). Sin tope: pip nunca le baja la versión de Orange a quien instala.
dependencies = ["Orange3>=3.40", "joblib>=1.3", "psutil"]
keywords = ["orange3 add-on", "parallel", "multiprocessing", "cross-validation", "linear svm", "liblinear", "text mining"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Plugins",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/Krl05oP11/orange3-paralelo"
Source = "https://github.com/Krl05oP11/orange3-paralelo"
Issues = "https://github.com/Krl05oP11/orange3-paralelo/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."orange3.addon"]
paralelo = "orangecontrib.paralelo"

[project.entry-points."orange.widgets"]
Paralelo = "orangecontrib.paralelo.widgets"

[tool.setuptools.packages.find]
include = ["orangecontrib*"]
namespaces = true

[tool.setuptools.package-data]
"orangecontrib.paralelo.widgets" = ["icons/*.svg"]
